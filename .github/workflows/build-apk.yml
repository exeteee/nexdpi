name: Build NexDPI Android and TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NexDPI (phone + Android TV)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out NexDPI overlay
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Check NexDPI project archive
        run: test -s nexdpi-project.zip

      - name: Fetch pinned GPL upstream and native submodules
        run: |
          git clone https://github.com/dovecoteescapee/ByeDPIAndroid.git upstream
          git -C upstream checkout --detach 43db0955de687d43f9473374dc7c5548eaa55359
          git -C upstream submodule update --init --recursive
          git -C upstream submodule status

      - name: Apply NexDPI branding and Android TV interface
        run: |
          mkdir -p overlay
          unzip -q nexdpi-project.zip -d overlay
          test -f overlay/apply_overlay.py
          python3 overlay/apply_overlay.py upstream --overlay overlay

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package corresponding GPL source
        run: |
          tar --exclude='upstream/.git' --exclude='upstream/**/.git' \
            --exclude='upstream/.gradle' --exclude='upstream/**/build' \
            -czf nexdpi-corresponding-source.tar.gz upstream

      - name: Upload NexDPI APK
        uses: actions/upload-artifact@v4
        with:
          name: nexdpi-phone-tv-debug-apk
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload corresponding source (GPL-3.0)
        uses: actions/upload-artifact@v4
        with:
          name: nexdpi-corresponding-source
          path: nexdpi-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 30
